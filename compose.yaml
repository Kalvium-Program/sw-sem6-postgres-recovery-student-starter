services:
  source:
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    environment:
      POSTGRES_USER: practice
      POSTGRES_DB: records
      POSTGRES_PASSWORD_FILE: /run/secrets/password
    secrets: [password]
    volumes: [source_data:/var/lib/postgresql/data, ./seed:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U practice -d records"]
      interval: 2s
      timeout: 3s
      retries: 30
  restore:
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    profiles: [recovery]
    environment:
      POSTGRES_USER: practice
      POSTGRES_DB: recovered
      POSTGRES_PASSWORD_FILE: /run/secrets/password
    secrets: [password]
    volumes: [restore_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U practice -d recovered"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  source_data:
  restore_data:
secrets:
  password:
    file: ./secrets/password.txt
