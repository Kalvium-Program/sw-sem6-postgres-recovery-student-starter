name: pg-recovery-practice
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: events
    volumes:
      - events_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d events"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  events_data:
